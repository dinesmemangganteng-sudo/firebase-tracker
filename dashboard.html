<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <nav class="bg-white shadow-md p-4 rounded-xl flex justify-between items-center mb-6">
    <h1 class="text-2xl font-semibold text-gray-800">Dashboard</h1>
    <a href="index.html" class="text-blue-600 hover:underline">Home</a>
  </nav>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div class="bg-white p-6 rounded-2xl shadow-xl">
      <h2 class="text-xl font-semibold mb-3 text-gray-700">Statistics</h2>
      <p class="text-gray-600">Overview of your application data.</p>
      <button class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-xl hover:bg-blue-700 transition">View</button>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-xl">
      <h2 class="text-xl font-semibold mb-3 text-gray-700">User Activity</h2>
      <p class="text-gray-600">Track user actions and performance.</p>
      <button class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-xl hover:bg-blue-700 transition">View</button>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-xl">
      <h2 class="text-xl font-semibold mb-3 text-gray-700">Settings</h2>
      <p class="text-gray-600">Configure app preferences and options.</p>
      <button class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-xl hover:bg-blue-700 transition">Edit</button>
    </div>
  </div>
</body>
</html>
